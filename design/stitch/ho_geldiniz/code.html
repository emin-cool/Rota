  </head><body class="bg-surface text-on-surface flex flex-col items-center justify-start min-h-screen"><div class="w-full max-w-[390px] min-h-screen flex flex-col relative bg-surface pt-safe pb-safe"><main class="flex-1 flex flex-col w-full bg-surface px-margin"><div class="flex flex-col w-full relative">
<!-- Visual Hero Container (Full-Bleed Aspect Framing) -->
<div class="relative w-full rounded-3xl overflow-hidden shadow-2xl flex flex-col justify-between p-space-md sm:p-space-lg min-h-[640px]">
<!-- Background Image with Istanbul Bosphorus Dawn -->
<div class="absolute inset-0 w-full h-full bg-cover bg-center transition-transform duration-1000 scale-105" data-alt="A focused athletic young runner moving along the Bebek coastal promenade of the Bosphorus Istanbul at early sunrise. Warm golden morning light hits the misty water surface and the distant silhouettes of the Bosphorus Bridge. Teal-toned oceanic waters, historic paved promenade, modern running apparel with subtle bright orange accents, cinematic low-angle action shot with vibrant atmospheric depth." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuA38rYY5-resRgONjeg7bz2O2mVKg_STw305mxEbxCVIIg5WtnmuPgRiNsRDskdeVCQdxRzSFHRstRwBihjEk4gmFi0ncD3ByoSdfgT1tTHOpkX_5ZSRGZyLAoObIvPM0YJsTmLkEH9RMldBeW-51IRmLHiC5ZA_k6E_9GiTBzKEwlzfvXIFDnJeRkjHUAJ_mJqECmUPAw7DjK0aTpWmeg3EUDFaauMypFEA6jOcS2z9A7Ry9yOMnYh1Q')">
</div>
<!-- Multi-tier Gradient Scrim for Contrast & Bosphorus Atmosphere -->
<div class="absolute inset-0 bg-gradient-to-b from-[#141b2b]/70 via-primary/30 to-[#141b2b]/95 pointer-events-none"></div>
<div class="absolute inset-0 bg-gradient-to-t from-primary/60 via-transparent to-transparent pointer-events-none"></div>
<!-- Top Status / Branding Bar -->
<div class="relative z-10 flex items-center justify-between w-full pt-space-xs">
<!-- Minimalist Brand Logo & Glyph -->
<div class="flex items-center gap-space-xs bg-surface-container-lowest/15 backdrop-blur-md px-3.5 py-1.5 rounded-full shadow-sm">
<div class="w-7 h-7 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container shadow-inner">
<span class="material-symbols-outlined text-[18px]">explore</span>
</div>
<span class="font-headline-sm text-headline-sm tracking-tight text-surface-container-lowest font-extrabold">ROTA</span>
</div>
<!-- Quick Locale / Live Beacon Pill -->
<div class="flex items-center gap-1.5 bg-surface-container-lowest/15 backdrop-blur-md px-3 py-1.5 rounded-full shadow-sm">
<span class="w-2 h-2 rounded-full bg-secondary-container animate-pulse"></span>
<span class="font-label-caps text-label-caps uppercase text-surface-container-lowest tracking-wider">İstanbul Canlı</span>
</div>
</div>
<!-- Floating Interactive Micro-Pills (Delight Elements) -->
<div class="relative z-10 my-auto flex flex-col gap-2.5 items-start">
<!-- Badge 1: Routes count -->
<div class="group flex items-center gap-2 bg-surface-container-lowest/90 backdrop-blur-md py-1.5 px-3 rounded-full shadow-md transition-all duration-300 hover:scale-105 active:scale-95 cursor-pointer" id="badge-routes">
<span class="flex items-center justify-center w-5 h-5 rounded-full bg-primary/10 text-primary">
<span class="material-symbols-outlined text-[15px]">route</span>
</span>
<span class="font-label-sm text-label-sm font-semibold text-primary">500+ Boğaz Rotası</span>
</div>
<!-- Badge 2: Community stat -->
<div class="group flex items-center gap-2 bg-surface-container-lowest/90 backdrop-blur-md py-1.5 px-3 rounded-full shadow-md transition-all duration-300 hover:scale-105 active:scale-95 cursor-pointer" id="badge-community">
<span class="flex items-center justify-center w-5 h-5 rounded-full bg-secondary/10 text-secondary">
<span class="material-symbols-outlined text-[15px]">group</span>
</span>
<span class="font-label-sm text-label-sm font-semibold text-secondary">45K+ Aktif Şehir Gezgini</span>
</div>
</div>
<!-- Content Bottom Sheet Panel (Hero Typography & Actions) -->
<div class="relative z-10 flex flex-col w-full pb-space-xs">
<!-- Hero Headings -->
<div class="space-y-2 mb-space-md">
<div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-secondary-container text-on-secondary-container font-label-caps text-label-caps font-bold">
<span class="material-symbols-outlined text-[13px]">bolt</span>
<span>HAREKETE GEÇ</span>
</div>
<h1 class="font-headline-lg text-headline-lg font-extrabold text-surface-container-lowest leading-tight tracking-tight">
          Şehrini adım adım keşfet
        </h1>
<p class="font-body-md text-body-md text-surface-container-highest/90 max-w-[310px] leading-relaxed">
          İstanbul'un en güzel yürüyüş, koşu ve bisiklet rotalarını keşfet, toplulukla birlikte hareket et.
        </p>
</div>
<!-- Action Stack -->
<div class="flex flex-col gap-3 w-full">
<!-- Primary Action: Başlayalım Button -->
<button class="w-full h-14 rounded-full bg-primary-container hover:bg-primary active:scale-[0.98] transition-all duration-200 flex items-center justify-between px-space-lg text-on-primary font-body-lg font-bold shadow-xl shadow-primary-container/25" id="btn-start">
<span>Başlayalım</span>
<span class="w-8 h-8 rounded-full bg-surface-container-lowest/20 flex items-center justify-center transition-transform duration-200 group-hover:translate-x-1">
<span class="material-symbols-outlined text-[20px] text-surface-container-lowest">arrow_forward</span>
</span>
</button>
<!-- Secondary Action: Ghost Glassmorphism Pill -->
<button class="w-full h-12 rounded-full bg-surface-container-lowest/15 hover:bg-surface-container-lowest/25 active:scale-[0.98] backdrop-blur-md transition-all duration-200 flex items-center justify-center text-surface-container-lowest font-body-md-medium font-semibold" id="btn-login">
          Zaten hesabım var
        </button>
</div>
<!-- iOS Home Indicator Accent -->
<div class="w-full flex justify-center pt-space-md pb-space-xs">
<div class="w-32 h-1 rounded-full bg-surface-container-lowest/40"></div>
</div>
</div>
</div>
</div>
<script>
  // Micro-delight particle/spring effect on interactive elements
  const badges = document.querySelectorAll('#badge-routes, #badge-community');
  badges.forEach(badge => {
    badge.addEventListener('click', () => {
      badge.classList.add('scale-110');
      setTimeout(() => badge.classList.remove('scale-110'), 200);
    });
  });

  const btnStart = document.getElementById('btn-start');
  if (btnStart) {
    btnStart.addEventListener('click', function(e) {
      const ripple = document.createElement('span');
      ripple.className = 'absolute inset-0 rounded-full bg-surface-container-lowest/20 animate-ping pointer-events-none';
      this.classList.add('relative');
      this.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    });
  }
</script></main></div></body></html>
